<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>'26년 손익 차트 갤러리</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-matrix@2.0.1/dist/chartjs-chart-matrix.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel-2:#fbfbfd; --line:#e4e7ec;
  --fg:#1a1d23; --fg-2:#5b6472; --fg-3:#8b94a3; --accent:#4f46e5; --accent-soft:#eef2ff;
  --pos:#0f9d76; --neg:#e0435c; --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
}
:root[data-theme="dark"]{
  --bg:#0e1116; --panel:#161a21; --panel-2:#1b2029; --line:#262c36;
  --fg:#e8ebf0; --fg-2:#a3adbb; --fg-3:#6f7a89; --accent:#8b83ff; --accent-soft:#1e1b3a;
  --pos:#34d399; --neg:#fb7185; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:'Pretendard','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
  -webkit-font-smoothing:antialiased; padding-bottom:88px;
}
.wrap{max-width:1580px;margin:0 auto;padding:0 20px}

header{border-bottom:1px solid var(--line);background:var(--panel)}
.head-top{display:flex;align-items:flex-start;gap:20px;padding:26px 0 18px;flex-wrap:wrap}
h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
.sub{font-size:13px;color:var(--fg-2);margin:0;line-height:1.6}
.sub b{color:var(--fg);font-weight:600}
.head-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;color:var(--fg-2);font:inherit;font-size:12.5px;font-weight:600;
  padding:7px 13px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.icon-btn{border:1px solid var(--line);background:var(--panel-2);color:var(--fg-2);border-radius:9px;
  padding:8px 12px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.icon-btn:hover{color:var(--fg);border-color:var(--fg-3)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:22px}
.kpi{background:var(--panel);padding:14px 16px}
.kpi .k{font-size:11.5px;color:var(--fg-3);font-weight:600;letter-spacing:.02em}
.kpi .v{font-size:23px;font-weight:700;letter-spacing:-.03em;margin:5px 0 3px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:11.5px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.up{color:var(--pos)} .down{color:var(--neg)}

.filters{position:sticky;top:0;z-index:30;background:var(--bg);
  border-bottom:1px solid var(--line);padding:11px 0}
.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flabel{font-size:11.5px;font-weight:700;color:var(--fg-3);margin-right:2px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--fg-2);border-radius:999px;
  padding:6px 12px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--fg-3);color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .n{opacity:.55;font-weight:600;margin-left:3px}

main{padding:22px 0 40px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:16px}
@media(max-width:520px){#grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;
  box-shadow:var(--shadow);display:flex;flex-direction:column}
.card.wide{grid-column:span 2}
@media(max-width:1000px){.card.wide{grid-column:span 1}}
.card.picked{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
.card-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:4px}
.card h3{font-size:14.5px;font-weight:700;margin:0;letter-spacing:-.01em;line-height:1.35}
.card h3 .no{color:var(--fg-3);font-weight:600;font-variant-numeric:tabular-nums;margin-right:5px}
.card .desc{font-size:12px;color:var(--fg-2);margin:5px 0 0;line-height:1.55}
.pick{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
  color:var(--fg-3);cursor:pointer;user-select:none;border:1px solid var(--line);border-radius:8px;
  padding:5px 9px;background:var(--panel-2);white-space:nowrap}
.pick input{accent-color:var(--accent);margin:0;cursor:pointer}
.card.picked .pick{color:var(--accent);border-color:var(--accent)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0 2px}
.tag{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:5px;background:var(--panel-2);
  border:1px solid var(--line);color:var(--fg-2)}
.tag.t-cat{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.cw{position:relative;height:290px;margin-top:10px;overflow:hidden}
.cw.tall{height:360px}
.gauges{display:flex;gap:6px;height:100%}
.gauge{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .gc{position:relative;width:100%;min-width:0;height:150px}
.gauge .gv{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-top:-38px;font-variant-numeric:tabular-nums}
.gauge .gl{font-size:11.5px;color:var(--fg-2);margin-top:26px;font-weight:600}
.gauge .gd{font-size:11px;color:var(--fg-3);margin-top:3px;font-variant-numeric:tabular-nums}
.hm{display:grid;gap:2px;font-size:10px;height:100%;align-content:center}
.hm .hc{border-radius:3px;display:flex;align-items:center;justify-content:center;padding:3px 2px;
  font-variant-numeric:tabular-nums;font-weight:600}
.hm .hl{color:var(--fg-2);justify-content:flex-end;padding-right:6px;font-weight:600;white-space:nowrap}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--fg-3);font-size:14px}

#pickbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--panel);
  border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(16,24,40,.08);transform:translateY(110%);
  transition:transform .22s cubic-bezier(.2,.8,.2,1)}
#pickbar.on{transform:none}
.pb{display:flex;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap}
.pb .cnt{font-size:13px;font-weight:700}
.pb .list{font-size:12px;color:var(--fg-2);flex:1;min-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 15px;
  font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
footer{color:var(--fg-3);font-size:11.5px;padding:0 0 30px;line-height:1.7}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="head-top">
      <div>
        <h1>'26년 손익 차트 갤러리</h1>
        <p class="sub">
          출처 <b>(AI) '26년 손익_8월.xlsx</b> &middot; 단위 <b>억원</b> &middot; 실적 <b>1~8월 확정 / 9~12월 추정</b><br>
          15개 차트를 훑어보고 <b>마음에 드는 것만 체크</b>하세요. 하단 바에서 선택 목록을 복사할 수 있습니다.
        </p>
      </div>
      <div class="head-actions">
        <div class="seg" id="scope">
          <button data-v="12" aria-pressed="true">연간 (추정 포함)</button>
          <button data-v="8" aria-pressed="false">확정만 (1~8월)</button>
        </div>
        <button class="icon-btn" id="themeBtn">🌙 다크</button>
      </div>
    </div>
    <div class="kpis" id="kpis"></div>
  </div>
</header>

<div class="filters">
  <div class="wrap">
    <div class="frow" id="catRow"><span class="flabel">분류</span></div>
    <div class="frow" id="typeRow" style="margin-top:8px"><span class="flabel">차트형태</span></div>
  </div>
</div>

<main class="wrap"><div id="grid"></div></main>

<footer class="wrap">
  Chart.js 4.4 &middot; 단일 HTML 파일 &middot; 체크 상태와 테마는 브라우저에 자동 저장됩니다.
</footer>

<div id="pickbar">
  <div class="wrap pb">
    <span class="cnt" id="pbCnt">0개 선택</span>
    <span class="list" id="pbList"></span>
    <button class="icon-btn" id="pbOnly">선택만 보기</button>
    <button class="icon-btn" id="pbClear">해제</button>
    <button class="btn-primary" id="pbCopy">목록 복사</button>
  </div>
</div>

function renderKpis(){
  const rp=pS('rev_total'), ra=aS('rev_total');
  const cp=pS('cost_total'), ca=aS('cost_total');
  const pp=pS('pl'),         pa=aS('pl');
  const cmA=aS('cm'), cmR=div(cmA,ra)*100, cmP=div(pS('cm'),rp)*100;
  const tag = H()===12 ? '연간' : '1~8월';
  const rows=[
    ['매출 실적 ('+tag+')', won(ra), '계획 '+won(rp)+' · 달성률 '+pc(ra/rp*100), ra>=rp],
    ['비용 실적 ('+tag+')', won(ca), '계획 '+won(cp)+' · 집행률 '+pc(ca/cp*100), ca<=cp],
    ['손익 ('+tag+')', won(pa), '계획 '+won(pp)+' · 차이 '+sgn(pa-pp)+'억', pa>=pp],
    ['매출직접비 차감손익', won(cmA), '차감손익률 '+pc(cmR)+' (계획 '+pc(cmP)+')', cmR>=cmP],
    ['제작사업 매출비중', pc(div(aS('rev_prod'),ra)*100), '이벤트 '+pc(div(aS('rev_event'),ra)*100), true]
  ];
  document.getElementById('kpis').innerHTML = rows.map(function(r){
    return '<div class="kpi"><div class="k">'+r[0]+'</div><div class="v">'+r[1]+'</div>'+
           '<div class="d '+(r[3]?'up':'down')+'">'+r[2]+'</div></div>';
  }).join('');
}

/* ═══════════ 렌더 헬퍼 ═══════════ */
function C(host, cfg){
  const cv = document.createElement('canvas');
  host.appendChild(cv);
  return new Chart(cv, cfg);
}

function centerText(fn){
  return { id:'ct'+Math.random().toString(36).slice(2), afterDraw:function(chart){
    const ctx=chart.ctx, ca=chart.chartArea; if(!ca) return;
    const parts = fn();
    const x=(ca.left+ca.right)/2, y=(ca.top+ca.bottom)/2;
    ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle=T().fg; ctx.font='700 19px '+Chart.defaults.font.family;
    ctx.fillText(parts[0], x, y-6);
    ctx.fillStyle=T().tick; ctx.font='600 11px '+Chart.defaults.font.family;
    ctx.fillText(parts[1], x, y+14); ctx.restore();
  }};
}

function gauges(host){
  const items = [
    { l:'매출 달성률', v:aS('rev_total')/pS('rev_total')*100, good:v=>v>=100,
      d:won(aS('rev_total'))+' / '+won(pS('rev_total')) },
    { l:'비용 집행률', v:aS('cost_total')/pS('cost_total')*100, good:v=>v<=100,
      d:won(aS('cost_total'))+' / '+won(pS('cost_total')) },
    { l:'손익 달성률', v:aS('pl')/pS('pl')*100, good:v=>v<=100,
      d:won(aS('pl'))+' / '+won(pS('pl')) }
  ];
  const box=document.createElement('div'); box.className='gauges'; host.appendChild(box);
  return items.map(function(it){
    const g=document.createElement('div'); g.className='gauge';
    const gc=document.createElement('div'); gc.className='gc';
    const val=document.createElement('div'); val.className='gv';
    const lab=document.createElement('div'); lab.className='gl';
    const det=document.createElement('div'); det.className='gd';
    const col = it.good(it.v)?P.pos:P.neg;
    val.textContent=pc(it.v,0); val.style.color=col;
    lab.textContent=it.l; det.textContent=it.d;
    g.appendChild(gc); g.appendChild(val); g.appendChild(lab); g.appendChild(det);
    box.appendChild(g);
    const filled=Math.max(0, Math.min(it.v,150));
    return C(gc,{ type:'doughnut',
      data:{ datasets:[{ data:[filled, Math.max(0,150-filled)],
        backgroundColor:[col, isDark()?'#262c36':'#eceff3'], borderWidth:0 }] },
      options:{ rotation:-90, circumference:180, cutout:'72%',
        plugins:{ legend:{display:false}, tooltip:{enabled:false} } } });
  });
}

function heatmap(host, keys){
  const rows = keys.map(function(k){ return { l:L(k),
    vals: ML().map(function(_,i){ const p=D[k].planM[i], a=D[k].actM[i];
      return (p==null||p===0||a==null) ? null : (a-p)/Math.abs(p)*100; }) }; });
  const colorOf = function(v){
    if(v==null) return isDark()?'#1f242d':'#f1f3f6';
    const t = Math.min(Math.abs(v),100)/100;
    return v>=0 ? 'rgba(224,67,92,'+(.12+t*.75)+')' : 'rgba(14,165,233,'+(.12+t*.75)+')';
  };

  let ok=false;
  try { Chart.registry.getController('matrix'); ok=true; }
  catch(e){
    try { const g = window.ChartMatrix || window['chartjs-chart-matrix'];
      if(g && g.MatrixController){ Chart.register(g.MatrixController, g.MatrixElement); ok=true; } }
    catch(e2){ ok=false; }
  }

  if(ok){
    const pts=[];
    rows.forEach(function(r){ r.vals.forEach(function(v,i){ pts.push({x:ML()[i], y:r.l, v:v}); }); });
    const yl = rows.map(r=>r.l).slice().reverse();
    return [C(host,{ type:'matrix',
      data:{ datasets:[{ label:'계획 대비 편차', data:pts,
        backgroundColor:c=>colorOf(c.raw.v), borderColor:T().panel, borderWidth:2, borderRadius:4,
        width:function(c){ return (((c.chart.chartArea||{}).width)||0)/ML().length - 3; },
        height:function(c){ return (((c.chart.chartArea||{}).height)||0)/rows.length - 3; } }] },
      options:{ scales:{
          x:{ type:'category', labels:ML(), offset:true, grid:{display:false},
              border:{display:false}, ticks:{font:{size:10.5}} },
          y:{ type:'category', labels:yl, offset:true, grid:{display:false},
              border:{display:false}, ticks:{font:{size:10.5}} } },
        plugins:{ legend:{display:false},
          tooltip:{ callbacks:{ title:()=>'',
            label:c=>[' '+c.raw.y+' · '+c.raw.x,
                      ' 계획 대비 '+(c.raw.v==null?'–':sgn(c.raw.v)+'%')] } } } } })];
  }

  const box=document.createElement('div'); box.className='hm';
  box.style.gridTemplateColumns = 'minmax(78px,auto) repeat('+ML().length+',1fr)';
  [''].concat(ML()).forEach(function(t){
    const d=document.createElement('div'); d.className='hc hl';
    d.style.justifyContent='center'; d.textContent=t; box.appendChild(d); });
  rows.forEach(function(r){
    const lab=document.createElement('div'); lab.className='hc hl'; lab.textContent=r.l;
    box.appendChild(lab);
    r.vals.forEach(function(v){ const d=document.createElement('div'); d.className='hc';
      d.style.background=colorOf(v);
      d.style.color = (v!=null && Math.abs(v)>55) ? '#fff' : 'inherit';
      d.textContent = v==null?'':Math.round(v)+'%';
      d.title = r.l+' '+(v==null?'':sgn(v)+'%');
      box.appendChild(d); });
  });
  host.appendChild(box);
  return [];
}

let picks = new Set();
try { picks = new Set(JSON.parse(localStorage.getItem('pl-picks') || '[]')); } catch(e){}

function visible(c){
  return (state.cat==='전체' || c.cat===state.cat)
      && (state.type==='전체' || c.types.indexOf(state.type)>=0)
      && (!state.only || picks.has(c.id));
}

function render(){
  live.forEach(function(ch){ try{ ch.destroy(); }catch(e){} });
  live=[];
  setDefaults(); renderKpis();
  const grid=document.getElementById('grid'); grid.innerHTML='';
  const list=CHARTS.filter(visible);
  if(!list.length){
    grid.innerHTML='<div class="empty">조건에 맞는 차트가 없습니다.</div>'; updateBar(); return; }

  list.forEach(function(spec){
    const i=CHARTS.indexOf(spec)+1;
    const card=document.createElement('section');
    card.className='card'+(spec.wide?' wide':'')+(picks.has(spec.id)?' picked':'');
    card.innerHTML =
      '<div class="card-head"><div>'+
        '<h3><span class="no">'+String(i).padStart(2,'0')+'</span>'+spec.title+'</h3>'+
        '<p class="desc">'+spec.desc+'</p></div>'+
        '<label class="pick"><input type="checkbox" '+(picks.has(spec.id)?'checked':'')+'>선택</label>'+
      '</div>'+
      '<div class="tags"><span class="tag t-cat">'+spec.cat+'</span>'+
        spec.types.map(t=>'<span class="tag">'+t+'</span>').join('')+'</div>'+
      '<div class="cw'+(spec.tall?' tall':'')+'"></div>';
    grid.appendChild(card);

    card.querySelector('input').addEventListener('change', function(e){
      if(e.target.checked) picks.add(spec.id); else picks.delete(spec.id);
      card.classList.toggle('picked', e.target.checked);
      try{ localStorage.setItem('pl-picks', JSON.stringify([].slice.call(picks))); }catch(err){}
      updateBar();
      if(state.only) render();
    });

    const host=card.querySelector('.cw');
    try { live = live.concat(spec.build(host) || []); }
    catch(err){ host.innerHTML='<div class="empty" style="padding:24px">렌더 오류: '+err.message+'</div>'; }
  });
  firstPaint = false;
  updateBar();
}

function updateBar(){
  document.getElementById('pickbar').classList.toggle('on', picks.size>0);
  document.getElementById('pbCnt').textContent = picks.size+'개 선택';
  document.getElementById('pbList').textContent = CHARTS.filter(c=>picks.has(c.id))
    .map(c=>'#'+String(CHARTS.indexOf(c)+1).padStart(2,'0')+' '+c.title).join('  ·  ');
}

/* ═══════════ 필터 UI ═══════════ */
function buildFilters(){
  const cats=['전체'].concat(Array.from(new Set(CHARTS.map(c=>c.cat))));
  const types=['전체'].concat(Array.from(new Set([].concat.apply([],CHARTS.map(c=>c.types)))));
  const mk=function(row,vals,key){
    vals.forEach(function(v){
      const n = v==='전체' ? CHARTS.length
        : CHARTS.filter(c=> key==='cat' ? c.cat===v : c.types.indexOf(v)>=0).length;
      const b=document.createElement('button'); b.className='chip';
      b.setAttribute('aria-pressed', String(state[key]===v));
      b.innerHTML = v+'<span class="n">'+n+'</span>';
      b.onclick=function(){
        state[key]=v;
        row.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed','false'));
        b.setAttribute('aria-pressed','true');
        render();
      };
      row.appendChild(b);
    });
  };
  mk(document.getElementById('catRow'), cats, 'cat');
  mk(document.getElementById('typeRow'), types, 'type');
}

/* ═══════════ 이벤트 ═══════════ */
document.getElementById('scope').addEventListener('click', function(e){
  const b=e.target.closest('button'); if(!b) return;
  state.h = +b.dataset.v;
  Array.prototype.forEach.call(e.currentTarget.children,
    x=>x.setAttribute('aria-pressed', String(x===b)));
  render();
});

document.getElementById('themeBtn').addEventListener('click', function(e){
  const dark = document.documentElement.dataset.theme==='dark';
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  e.target.textContent = dark ? '🌙 다크' : '☀️ 라이트';
  try{ localStorage.setItem('pl-theme', document.documentElement.dataset.theme); }catch(err){}
  render();
});

document.getElementById('pbClear').onclick = function(){
  picks.clear();
  try{ localStorage.setItem('pl-picks','[]'); }catch(e){}
  state.only=false;
  document.getElementById('pbOnly').textContent='선택만 보기';
  render();
};

document.getElementById('pbOnly').onclick = function(e){
  state.only=!state.only;
  e.target.textContent = state.only ? '전체 보기' : '선택만 보기';
  render();
};

document.getElementById('pbCopy').onclick = function(e){
  const txt = CHARTS.filter(c=>picks.has(c.id))
    .map(c=>'#'+String(CHARTS.indexOf(c)+1).padStart(2,'0')+' '+c.title+'  ['+c.cat+' / '+c.types.join(', ')+']')
    .join('\n');
  const btn=e.target;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){
      btn.textContent='복사됨 ✓'; setTimeout(()=>btn.textContent='목록 복사',1400);
    }).catch(function(){ window.prompt('아래 목록을 복사하세요', txt); });
  } else { window.prompt('아래 목록을 복사하세요', txt); }
};

/* ═══════════ 시작 ═══════════ */
(function init(){
  let saved=null;
  try{ saved = localStorage.getItem('pl-theme'); }catch(e){}
  if(saved){
    document.documentElement.dataset.theme = saved;
    document.getElementById('themeBtn').textContent = saved==='dark' ? '☀️ 라이트' : '🌙 다크';
  }
  buildFilters();
  render();
})();
</script>
</body>
</html>

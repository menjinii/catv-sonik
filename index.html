<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>2026 손익 리포트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f7f9;
    --surface:#ffffff;
    --border:#e3e6ea;
    --text:#17191c;
    --muted:#6b7280;
    --accent:#2a78d6;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111316;
      --surface:#1a1d21;
      --border:#2b3037;
      --text:#e9ebee;
      --muted:#9aa2ad;
      --accent:#6aa9f0;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#111316;
    --surface:#1a1d21;
    --border:#2b3037;
    --text:#e9ebee;
    --muted:#9aa2ad;
    --accent:#6aa9f0;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    padding:64px 16px;
  }
  main{width:100%;max-width:680px}
  .eyebrow{
    font-size:12px;
    font-weight:700;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 10px;
  }
  h1{
    font-size:clamp(26px,5vw,34px);
    font-weight:800;
    letter-spacing:-.02em;
    margin:0 0 8px;
  }
  .sub{color:var(--muted);font-size:15px;line-height:1.6;margin:0 0 36px}
  .cards{display:grid;gap:14px}
  a.card{
    display:flex;
    align-items:center;
    gap:18px;
    padding:22px 24px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:var(--shadow);
    text-decoration:none;
    color:inherit;
    transition:transform .15s ease, border-color .15s ease;
  }
  a.card:hover{transform:translateY(-2px);border-color:var(--accent)}
  .glyph{
    flex:none;
    width:44px;height:44px;
    display:grid;place-items:center;
    border-radius:11px;
    background:color-mix(in srgb, var(--accent) 12%, transparent);
    color:var(--accent);
  }
  .glyph svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .body{flex:1;min-width:0}
  .body strong{display:block;font-size:16.5px;font-weight:700;margin-bottom:3px}
  .body span{display:block;font-size:13.5px;color:var(--muted);line-height:1.5}
  .chev{flex:none;color:var(--muted)}
  .chev svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  footer{margin-top:40px;font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <p class="eyebrow">CATV · 2026</p>
  <h1>손익 리포트</h1>
  <p class="sub">2026년 손익 계획 대시보드와 차트 갤러리입니다.</p>

  <div class="cards">
    <a class="card" href="%EC%86%90%EC%9D%B5_%EB%8C%80%EC%8B%9C%EB%B3%B4%EB%93%9C.html">
      <span class="glyph" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
      </span>
      <span class="body">
        <strong>2026년 손익 대시보드</strong>
        <span>월별 손익 현황, 주요 지표와 상세 분석</span>
      </span>
      <span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span>
    </a>

    <a class="card" href="%EC%86%90%EC%9D%B5_%EC%B0%A8%ED%8A%B8_%EA%B0%A4%EB%9F%AC%EB%A6%AC.html">
      <span class="glyph" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </span>
      <span class="body">
        <strong>'26년 손익 차트 갤러리</strong>
        <span>손익 관련 차트 모음</span>
      </span>
      <span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span>
    </a>
  </div>

  <footer>내부 참고용 자료입니다.</footer>
</main>
</body>
</html>
